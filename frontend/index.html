<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inventory & Cart</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <h1>Inventory &amp; Cart</h1>
    <div class="api-status">
      <span id="apiDot" class="dot"></span>
      <span id="apiStatusText">Checking API...</span>
    </div>
  </header>

  <main class="layout">
    <section class="panel">
      <h2>Add Product</h2>
      <form id="productForm" class="inline-form">
        <input type="text" id="productName" placeholder="Product name" required />
        <input type="number" id="productPrice" placeholder="Price" min="0.01" step="0.01" required />
        <input type="number" id="productStock" placeholder="Stock" min="0" step="1" required />
        <button type="submit">Add Product</button>
      </form>

      <h2>Products</h2>
      <table class="data-table">
        <thead>
          <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Price</th>
            <th>Stock</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="productsBody">
          <tr><td colspan="5" class="empty-row">Loading products...</td></tr>
        </tbody>
      </table>
    </section>

    <section class="panel">
      <h2>Cart</h2>
      <table class="data-table">
        <thead>
          <tr>
            <th>Product</th>
            <th>Price</th>
            <th>Qty</th>
            <th>Total</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="cartBody">
          <tr><td colspan="5" class="empty-row">Cart is empty</td></tr>
        </tbody>
      </table>

      <div class="cart-footer">
        <span class="cart-total">
          Total: <strong id="cartTotal">$0.00</strong>
        </span>

        <div class="cart-actions">
          <button id="clearCartBtn" class="clear-cart-btn">
            Clear Cart
          </button>

          <button id="checkoutBtn" class="checkout-btn">
            Checkout
          </button>
        </div>
      </div>
    </section>
  </main>

  <div id="toast" class="toast"></div>

  <script src="app.js"></script>
</body>
</html>
